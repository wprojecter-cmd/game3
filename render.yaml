services:
  - type: web
    name: game3
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_CESIUM_ION_TOKEN
        sync: false
      - key: CESIUM_ION_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
